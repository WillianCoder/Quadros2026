<script>
(function () {
  'use strict';
  var C = document.getElementById('conteudo');
  var CONFIG = { unidade: 'Polícia Militar do Estado de São Paulo', subunidade: 'Patrulha Mulher Segura', cidade: 'São Paulo' };
  var EMAIL = '';

  /* ---------- servidor (ou modo demonstração fora do Google) ---------- */
  var DEMO = !(window.google && google.script && google.script.run);
  function srv(fn) {
    var args = [].slice.call(arguments, 1);
    return new Promise(function (ok, erro) {
      if (DEMO) return setTimeout(function () { ok(demo(fn, args)); }, 200);
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { erro(e && e.message ? e.message : String(e)); });
      r[fn].apply(r, args);
    });
  }
  function demo(fn, a) {
    var reg = JSON.parse(localStorage.getItem('demoReg') || '[]');
    var log = function (acao, mod, d) { reg.unshift([new Date().toLocaleString('pt-BR'), 'demonstracao@local', acao, mod, d, '']); localStorage.setItem('demoReg', JSON.stringify(reg)); };
    if (fn === 'iniciar') return { email: 'modo demonstração', config: CONFIG, pasta: '#' };
    if (fn === 'salvarDocumento') { log('Criou documento', a[0], a[1]); return { url: '#', pasta: '#' }; }
    if (fn === 'lerRegistro') return { linhas: reg, url: '#' };
    if (fn === 'listarArquivos') return { pasta: '#', arquivos: reg.filter(function (r) { return r[2] === 'Criou documento'; }).map(function (r) { return { nome: r[4], url: '#', caminho: r[3] }; }) };
    if (fn === 'lerLivro') return { url: '#', linhas: [['', '20/10/2026', '11 99999-0000', 'MARIA (TESTE)', 'A99', 'Atendida — contato realizado', 'Sim', '22/10/2026 10:00', '000000-0', 'SILVA', '21/10/2026 09:30', '2ª Cia', '']] };
    if (fn === 'efetivo') {
      var ef = JSON.parse(localStorage.getItem('demoEf') || '[]'), d = a[1] || {};
      if (a[0] !== 'listar') { ef = ef.filter(function (p) { return p.re !== String(d.re).toUpperCase(); }); if (a[0] === 'add') ef.push({ grad: d.grad.toUpperCase(), re: String(d.re).toUpperCase(), qra: d.qra.toUpperCase(), cia: d.cia }); localStorage.setItem('demoEf', JSON.stringify(ef)); }
      return ef;
    }
    if (fn === 'adminEntrar') { if (a[0] !== 'demo') throw new Error('Senha incorreta (no modo demonstração use: demo)'); return { config: CONFIG }; }
    return {};
  }

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hoje() { var d = new Date(); return d.toISOString().slice(0, 10); }
  function agoraHora() { return new Date().toTimeString().slice(0, 5); }
  function dataBR(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return s || ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  var timer;
  function aviso(html) { var a = document.getElementById('aviso'); a.innerHTML = html; a.classList.add('ver'); clearTimeout(timer); timer = setTimeout(function () { a.classList.remove('ver'); }, 5000); }
  function cabecalho(titulo) {
    return '<div class="cab"><strong>' + esc(CONFIG.unidade) + '</strong><br>' + esc(CONFIG.subunidade) + '<h1>' + esc(titulo) + '</h1></div>';
  }
  function imprimir(htmlRelatorio) {
    var r = C.querySelector('.relatorio');
    if (htmlRelatorio && r) { r.innerHTML = htmlRelatorio; document.body.classList.add('modo-relatorio'); }
    window.print();
    document.body.classList.remove('modo-relatorio');
  }
  function btImprimir() { return '<button type="button" class="imprimir" data-acao="imprimir" title="Imprimir">🖨 imprimir</button>'; }
  function titulo(t, d) { return '<div class="acoes nao-imprimir" style="margin:0"><div><h1>' + esc(t) + '</h1></div>' + btImprimir() + '</div>' + (d ? '<p class="desc tela">' + esc(d) + '</p>' : ''); }

  /* ---------- formulários declarativos ---------- */
  var SN = ['', 'Sim', 'Não'];
  var ORIGEM = ['', 'Emergência 190', 'Cabine Lilás (COPOM)', 'App SOS Mulher', 'App SP Mulher Segura', 'Campanha Sinal Vermelho', 'Abrigo Amigo', 'Iniciativa da equipe', 'Outro'];
  var VINCULO = ['', 'Marido/companheiro', 'Ex-marido/ex-companheiro', 'Namorado/ex-namorado', 'Filho(a)', 'Pai/mãe', 'Irmão(ã)', 'Outro familiar', 'Outro'];

  var FORMS = {
    vd: {
      titulo: 'Atendimento de Violência Doméstica / Descumprimento de MPU', modulo: 'Violência Doméstica',
      desc: 'POP 2.09.01 — preencha durante ou logo após o atendimento. Gera relatório para imprimir e salvar.',
      alerta: 'Certifique-se de que é violência doméstica e/ou descumprimento de Medida Protetiva. Havendo MPU contra o autor, as partes devem ser conduzidas ao DP, independentemente de outros fatores de risco.',
      secoes: [
        ['Acionamento', [['data', 'Data', 'date'], ['hora', 'Horário', 'time'], ['bo', 'Nº ocorrência / BOe'], ['origem', 'Origem do acionamento', ORIGEM], ['viatura', 'Viatura / prefixo'], ['equipe', 'Equipe (grad., RE, nome)'], ['endereco', 'Endereço da ocorrência', 'larga']]],
        ['Vítima', [['vNome', 'Nome'], ['vIdade', 'Idade', 'number'], ['vTel', 'Telefone'], ['vDoc', 'Documento (RG/CPF)'], ['vEnd', 'Endereço', 'larga']]],
        ['Autor', [['aNome', 'Nome'], ['aIdade', 'Idade', 'number'], ['aVinculo', 'Vínculo com a vítima', VINCULO], ['aDoc', 'Documento (RG/CPF)'], ['aAntec', 'Antecedentes / pesquisa', 'larga']]],
        ['Fatos', [['natureza', 'Natureza', ['', 'Lesão corporal', 'Ameaça', 'Descumprimento de MPU (art. 24-A)', 'Vias de fato', 'Injúria / difamação', 'Dano', 'Perseguição (stalking)', 'Violência psicológica', 'Outro']],
          ['mpu', 'Existe Medida Protetiva?', ['', 'Sim — documento apresentado', 'Sim — informado pelo app', 'Não', 'Não sabe']], ['mpuNum', 'Nº do processo da MPU'],
          ['lesao', 'Lesão aparente?', SN], ['medico', 'Atendimento médico (local)'], ['criancas', 'Crianças/dependentes no local?', SN], ['armas', 'Arma(s) no local / apreendida(s)?', SN],
          ['relato', 'Relato dos fatos', 'texto']]],
        ['Providências (POP 2.09.01)', 'checks', [
          'Interação gravada em COP (quando disponível)',
          'Vítima localizada e integridade física resguardada',
          'Policial que iniciou o atendimento seguiu até o fim (evitar revitimização)',
          'Vítima coberta/preservada se sem vestes ou vestes rasgadas',
          'Estado físico e psíquico avaliado; atendimento médico providenciado se necessário',
          'Informações transmitidas pela rede rádio',
          'Suspeito localizado e conduzido à área de segurança',
          'Abordagem e busca pessoal (POP 1.01.05 / 1.01.06)',
          'Uso de algemas justificado (POP 5.03.02)',
          'Direitos constitucionais informados ao preso',
          'Verificado documento da MPU (se não acionado por app)',
          'Partes qualificadas, testemunhas arroladas e antecedentes pesquisados',
          'Vítima orientada sobre SOS Mulher, SP Mulher Segura e rede de apoio',
          'Funcionário de farmácia (Sinal Vermelho) NÃO arrolado como testemunha']],
        ['Encaminhamento', [['dp', 'Distrito Policial / DDM'], ['resultado', 'Resultado', ['', 'Prisão em flagrante', 'Registro de BO sem prisão', 'Autor evadido — buscas', 'Orientação às partes', 'Outro']], ['obs', 'Observações', 'texto']]]
      ]
    },
    sexual: {
      titulo: 'Atendimento de Ocorrência de Crime Sexual', modulo: 'Crime Sexual',
      desc: 'POP 2.09.02 — acolhimento sem revitimização. Gera relatório para imprimir e salvar.',
      alerta: 'Prioridade é a vítima: atendimento médico imediato (profilaxia é mais eficaz nas primeiras horas). Oriente a não tomar banho nem trocar/lavar roupas, para preservar vestígios.',
      secoes: [
        ['Acionamento', [['data', 'Data', 'date'], ['hora', 'Horário', 'time'], ['bo', 'Nº ocorrência / BOe'], ['origem', 'Origem do acionamento', ORIGEM], ['local', 'Tipo de local', ['', 'Residência', 'Via pública', 'Transporte público', 'Bar/casa de show (Protocolo Não Se Cale)', 'Outro']], ['endereco', 'Endereço', 'larga'], ['equipe', 'Equipe (grad., RE, nome)', 'larga']]],
        ['Vítima', [['vNome', 'Nome'], ['vIdade', 'Idade', 'number'], ['vTel', 'Telefone'], ['vDoc', 'Documento']]],
        ['Suspeito', [['aNome', 'Nome / características'], ['aVinculo', 'Conhece a vítima?', ['', 'Desconhecido', 'Conhecido', 'Familiar', 'Parceiro/ex']], ['aSit', 'Situação', ['', 'Detido no local', 'Evadido', 'Identificado, não localizado']]]],
        ['Fatos', [['natureza', 'Natureza', ['', 'Estupro', 'Estupro de vulnerável', 'Importunação sexual', 'Assédio sexual', 'Registro não autorizado de intimidade', 'Outro']], ['relato', 'Relato (resumido, sem expor a vítima)', 'texto']]],
        ['Providências', 'checks', [
          'Interação gravada em COP (quando disponível)',
          'Vítima acolhida em local reservado, longe de curiosos',
          'Atendimento médico / hospital de referência acionado',
          'Vítima orientada a preservar vestígios (não banhar, não lavar roupas)',
          'Local preservado para perícia',
          'Mesmo policial acompanhou a vítima do início ao fim',
          'Testemunhas e imagens de câmeras identificadas',
          'Vítima informada sobre Sala Lilás (IML) e DDM',
          'Conselho Tutelar acionado (vítima criança/adolescente)']],
        ['Encaminhamento', [['hospital', 'Hospital / unidade de saúde'], ['dp', 'DP / DDM'], ['obs', 'Observações', 'texto']]]
      ]
    },
    visita: {
      titulo: 'Relatório de Visita — Patrulha Mulher Segura', modulo: 'Visitas',
      desc: 'Registro da visita presencial à vítima acompanhada.',
      secoes: [
        ['Visita', [['data', 'Data', 'date'], ['hora', 'Horário', 'time'], ['bo', 'Nº ocorrência / BOe de origem'], ['equipe', 'Equipe (grad., RE, nome)', 'larga'], ['vNome', 'Nome da vítima'], ['vTel', 'Telefone'], ['endereco', 'Endereço', 'larga']]],
        ['Situação encontrada', [['atendeu', 'Vítima encontrada?', SN], ['autorPresente', 'Autor presente/próximo?', SN], ['novaViolencia', 'Nova violência desde o fato?', SN], ['mpu', 'Possui MPU vigente?', SN], ['situacao', 'Descrição', 'texto']]],
        ['Orientações prestadas', 'checks', ['Apps SOS Mulher / SP Mulher Segura', 'Botão do pânico (quando há MPU)', 'DDM / DDM Online', 'Casa Abrigo', 'Auxílio-Aluguel (R$ 500/mês)', 'Ligue 180 / 190', 'Centro de referência / assistência social']],
        ['Encaminhamento', [['proxima', 'Próxima ação', ['', 'Nova visita', 'Nova ligação', 'Encerrar acompanhamento', 'Encaminhar à rede']], ['proximaData', 'Data prevista', 'date'], ['obs', 'Observações', 'texto']]]
      ]
    }
  };

  function campo(c) {
    var id = 'f_' + c[0], tipo = c[2], larga = tipo === 'larga' || tipo === 'texto';
    var h = '<div' + (larga ? ' style="grid-column:1/-1"' : '') + '><label for="' + id + '">' + esc(c[1]) + '</label>';
    if (Array.isArray(tipo)) h += '<select id="' + id + '" name="' + c[0] + '">' + tipo.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>';
    else if (tipo === 'texto') h += '<textarea id="' + id + '" name="' + c[0] + '"></textarea>';
    else h += '<input id="' + id + '" name="' + c[0] + '" type="' + (tipo && tipo !== 'larga' ? tipo : 'text') + '"' + (tipo === 'date' ? ' value="' + hoje() + '"' : tipo === 'time' ? ' value="' + agoraHora() + '"' : '') + '>';
    return h + '</div>';
  }
  function telaForm(chave) {
    var f = FORMS[chave];
    var h = titulo(f.titulo, f.desc) + '<div class="tela">' + (f.alerta ? '<div class="alerta">⚠️ ' + esc(f.alerta) + '</div>' : '') + '<form id="form">';
    f.secoes.forEach(function (s, i) {
      h += '<div class="cartao"><h2 style="margin-top:0">' + esc(s[0]) + '</h2>';
      if (s[1] === 'checks') h += s[2].map(function (t, j) { return '<label class="check"><input type="checkbox" name="ck' + i + '_' + j + '"> ' + esc(t) + '</label>'; }).join('');
      else h += '<div class="grade">' + s[1].map(campo).join('') + (s[1].some(function (c) { return c[0] === 'equipe'; }) ? seletorPM('selEquipe', '👮 Adicionar policial à equipe') : '') + '</div>';
      h += '</div>';
    });
    h += '<div class="acoes"><button class="bt" type="submit">💾 Salvar no Drive</button><button class="bt sec" type="button" data-acao="relatorio">🖨 Imprimir relatório</button><button class="bt sec" type="reset">Limpar</button></div></form></div><div class="relatorio"></div>';
    C.innerHTML = h;
    var form = document.getElementById('form');
    var gera = function () { return relatorioForm(f, form); };
    ligarSeletores(function (p) { var eq = document.getElementById('f_equipe'); if (eq) eq.value = (eq.value ? eq.value + '; ' : '') + rotuloPM(p); });
    C.querySelector('[data-acao=relatorio]').onclick = function () { imprimir(gera()); };
    C.querySelector('[data-acao=imprimir]').onclick = function () { imprimir(gera()); };
    form.onsubmit = function (e) {
      e.preventDefault();
      var d = dadosForm(form), nome = f.titulo.split(' — ')[0] + ' - ' + (d.bo || d.vNome || 'sem nº');
      salvar(f.modulo, nome, gera(), d, form.querySelector('[type=submit]'));
    };
  }
  function dadosForm(form) { var d = {}; [].forEach.call(form.elements, function (el) { if (el.name) d[el.name] = el.type === 'checkbox' ? el.checked : el.value; }); return d; }
  function relatorioForm(f, form) {
    var d = dadosForm(form), h = cabecalho(f.titulo);
    f.secoes.forEach(function (s, i) {
      h += '<h2>' + esc(s[0]) + '</h2><table>';
      if (s[1] === 'checks') h += s[2].map(function (t, j) { return '<tr><td style="width:30px;text-align:center">' + (d['ck' + i + '_' + j] ? '☑' : '☐') + '</td><td>' + esc(t) + '</td></tr>'; }).join('');
      else h += s[1].map(function (c) { var v = d[c[0]]; if (c[2] === 'date') v = dataBR(v); return '<tr><th>' + esc(c[1]) + '</th><td>' + esc(v).replace(/\n/g, '<br>') + '</td></tr>'; }).join('');
      h += '</table>';
    });
    return h + '<p style="font-size:9pt;color:#666">Gerado em ' + new Date().toLocaleString('pt-BR') + ' por ' + esc(EMAIL) + '</p><div class="ass">______________________________________<br>Policial responsável (grad., RE, nome)</div>';
  }
  function salvar(modulo, nome, html, dados, bt) {
    if (bt) { bt.disabled = true; bt.textContent = 'Salvando…'; }
    return srv('salvarDocumento', modulo, nome, html, dados).then(function (r) {
      aviso('✅ Salvo no seu Drive. <a href="' + esc(r.url) + '" target="_blank" rel="noopener">Abrir arquivo</a>');
    }).catch(function (e) { aviso('❌ ' + esc(e)); }).then(function () { if (bt) { bt.disabled = false; bt.textContent = '💾 Salvar no Drive'; } });
  }

  /* ---------- efetivo (policiais cadastrados) ---------- */
  var EFETIVO = null;
  function carregarEfetivo() {
    return srv('efetivo', 'listar', null).then(function (l) { EFETIVO = l || []; return EFETIVO; });
  }
  function rotuloPM(p) { return [p.grad, p.re, p.qra].filter(Boolean).join(' '); }
  /** Seletor de policial agrupado por Cia. Ao escolher, chama fn(policial). */
  function seletorPM(id, texto) {
    return '<div class="nao-imprimir"><label for="' + id + '">' + esc(texto || '👮 Escolher do efetivo') + '</label><select id="' + id + '" data-seletor-pm><option value="">Carregando…</option></select></div>';
  }
  function ligarSeletores(fn) {
    var sels = C.querySelectorAll('[data-seletor-pm]');
    if (!sels.length) return;
    (EFETIVO ? Promise.resolve(EFETIVO) : carregarEfetivo()).then(function (lista) {
      var grupos = {};
      lista.forEach(function (p, i) { (grupos[p.cia || 'Sem Cia'] = grupos[p.cia || 'Sem Cia'] || []).push('<option value="' + i + '">' + esc(rotuloPM(p)) + '</option>'); });
      var html = '<option value="">' + (lista.length ? 'Selecione…' : 'Nenhum policial cadastrado (menu Efetivo)') + '</option>' +
        Object.keys(grupos).sort().map(function (g) { return '<optgroup label="' + esc(g) + '">' + grupos[g].join('') + '</optgroup>'; }).join('');
      [].forEach.call(sels, function (sel) {
        sel.innerHTML = html;
        sel.onchange = function () { if (sel.value !== '') { fn(lista[+sel.value], sel); sel.value = ''; } };
      });
    }).catch(function (e) { [].forEach.call(sels, function (sel) { sel.innerHTML = '<option>Erro ao carregar efetivo</option>'; }); });
  }
  function telaEfetivo() {
    C.innerHTML = titulo('Efetivo', 'Policiais cadastrados aparecem para seleção nos formulários e na escala. Todos usam a mesma lista; cada inclusão ou exclusão fica no registro.') +
      '<div class="cartao nao-imprimir"><h2 style="margin-top:0">Adicionar / alterar policial</h2><form id="fe"><div class="grade">' +
      campo(['pGrad', 'Graduação', ['SD', 'CB', '3º SGT', '2º SGT', '1º SGT', 'SUBTEN', 'ASP OF', '2º TEN', '1º TEN', 'CAP', 'MAJ', 'TEN CEL', 'CEL']]) +
      campo(['pRe', 'RE']) + campo(['pQra', 'QRA (nome de guerra)']) + campo(['pCia', 'Cia']) +
      '</div><p class="desc" style="margin:8px 0 0">Se o RE já existir, os dados são atualizados.</p><div class="acoes"><button class="bt">+ Adicionar</button></div></form></div>' +
      '<div class="cartao tela"><div class="grade nao-imprimir" style="margin-bottom:12px">' + campo(['pFiltro', 'Filtrar por Cia ou nome']) + '</div><div id="listaEf"><p class="vazio">Carregando…</p></div></div><div class="relatorio"></div>';
    var cias = '';
    function desenhar() {
      var f = (document.getElementById('f_pFiltro').value || '').toLowerCase();
      var l = (EFETIVO || []).filter(function (p) { return !f || (rotuloPM(p) + ' ' + p.cia).toLowerCase().indexOf(f) >= 0; });
      document.getElementById('listaEf').innerHTML = l.length ? '<div class="rolar"><table class="tabela"><tr><th>Cia</th><th>Grad.</th><th>RE</th><th>QRA</th><th class="nao-imprimir"></th></tr>' +
        l.map(function (p) { return '<tr><td>' + esc(p.cia) + '</td><td>' + esc(p.grad) + '</td><td>' + esc(p.re) + '</td><td>' + esc(p.qra) + '</td><td class="nao-imprimir" style="width:1%;white-space:nowrap"><button class="imprimir" data-ed="' + esc(p.re) + '">editar</button> <button class="imprimir" data-del="' + esc(p.re) + '">🗑 apagar</button></td></tr>'; }).join('') +
        '</table></div><p class="desc" style="margin-top:8px">' + l.length + ' policial(is)</p>' : '<p class="vazio">Nenhum policial cadastrado ainda.</p>';
    }
    function atualizar(op, dados) {
      return srv('efetivo', op, dados).then(function (l) { EFETIVO = l || []; desenhar(); }).catch(function (e) { aviso('❌ ' + esc(e)); });
    }
    carregarEfetivo().then(desenhar).catch(function (e) { document.getElementById('listaEf').innerHTML = '<p class="vazio">❌ ' + esc(e) + '</p>'; });
    document.getElementById('f_pFiltro').addEventListener('input', desenhar);
    document.getElementById('fe').onsubmit = function (e) {
      e.preventDefault();
      var v = function (k) { return document.getElementById('f_' + k).value.trim(); };
      if (!v('pRe') || !v('pQra')) return aviso('Preencha RE e QRA.');
      var bt = this.querySelector('button'); bt.disabled = true;
      atualizar('add', { grad: v('pGrad'), re: v('pRe'), qra: v('pQra'), cia: v('pCia') }).then(function () {
        aviso('✅ Policial salvo.'); bt.disabled = false;
        document.getElementById('f_pRe').value = ''; document.getElementById('f_pQra').value = ''; document.getElementById('f_pRe').focus();
      });
    };
    document.getElementById('listaEf').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var re = b.getAttribute('data-del') || b.getAttribute('data-ed');
      var p = (EFETIVO || []).filter(function (x) { return x.re === re; })[0]; if (!p) return;
      if (b.hasAttribute('data-ed')) {
        document.getElementById('f_pGrad').value = p.grad; document.getElementById('f_pRe').value = p.re;
        document.getElementById('f_pQra').value = p.qra; document.getElementById('f_pCia').value = p.cia; window.scrollTo(0, 0);
      } else if (confirm('Apagar ' + rotuloPM(p) + ' do efetivo?')) atualizar('del', { re: re, grad: p.grad, qra: p.qra, cia: p.cia }).then(function () { aviso('Policial apagado.'); });
    });
    C.querySelector('[data-acao=imprimir]').onclick = function () { imprimir(cabecalho('Efetivo cadastrado') + document.getElementById('listaEf').innerHTML); };
  }

  /* ---------- roteiro da ligação ---------- */
  var PERGUNTAS = [
    'Bom dia/boa tarde. Eu poderia falar com a senhora [nome da mulher]?',
    'Meu nome é [posto/graduação e nome], sou policial militar do Programa Mulher Segura.',
    'A senhora está sozinha neste momento?',
    'A senhora pode conversar agora ou prefere que eu retorne em outro horário?',
    'Estou entrando em contato para um acompanhamento relacionado à ocorrência registrada no dia [data].',
    'A senhora autoriza que eu faça algumas perguntas para verificar como está sua segurança atualmente?',
    'Preciso confirmar primeiro: a senhora está correndo algum perigo neste exato momento?',
    'O autor está na mesma residência ou no mesmo local que a senhora?',
    'Depois daquele atendimento, ocorreu alguma nova ameaça, agressão ou discussão?',
    'Como a senhora está se sentindo física e emocionalmente?',
    'A senhora já conhece os aplicativos "SOS Mulher" e "SP Mulher Segura"?',
    'A senhora gostaria de receber uma visita presencial da Patrulha Mulher Segura?',
    'Qual seria o melhor dia e horário?',
    'A senhora gostaria de receber uma nova ligação?'
  ];
  var ABERTAS = { 1: 1, 4: 1, 9: 1, 12: 1 };
  function telaLigacao() {
    var nome = function (n, l, t) { return campo([n, l, t]); };

        (r.arquivos.length ? '<div class="rolar"><table class="tabela"><tr><th>Pasta</th><th>Arquivo</th></tr>' + r.arquivos.map(function (a) { return '<tr><td>' + esc(a.caminho) + '</td><td><a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.nome) + '</a></td></tr>'; }).join('') + '</table></div>' : '<p class="vazio">Nenhum documento salvo ainda.</p>');
    }).catch(function (e) { C.querySelector('.cartao').innerHTML = '<p class="vazio">❌ ' + esc(e) + '</p>'; });
    C.querySelector('[data-acao=imprimir]').onclick = function () { imprimir(); };
  }
  function telaRegistro() {
    C.innerHTML = titulo('Registro de edições', 'Histórico permanente: toda conta que salva ou altera algo fica registrada aqui. Todos podem ver; ninguém pode apagar.') + '<div class="cartao"><p class="vazio">Carregando…</p></div>';
    srv('lerRegistro').then(function (r) {
      C.querySelector('.cartao').innerHTML = '<p class="nao-imprimir">🔒 <a href="' + esc(r.url) + '" target="_blank" rel="noopener">Ver planilha original (somente leitura)</a> · últimos 500 registros</p>' +
        (r.linhas.length ? '<div class="rolar"><table class="tabela"><tr><th>Data/hora</th><th>Conta</th><th>Ação</th><th>Módulo</th><th>Descrição</th></tr>' +
          r.linhas.map(function (l) { return '<tr><td>' + esc(l[0]) + '</td><td>' + esc(l[1]) + '</td><td>' + esc(l[2]) + '</td><td>' + esc(l[3]) + '</td><td>' + (l[5] && /^https:\/\//.test(l[5]) ? '<a href="' + esc(l[5]) + '" target="_blank" rel="noopener">' + esc(l[4]) + '</a>' : esc(l[4])) + '</td></tr>'; }).join('') + '</table></div>' : '<p class="vazio">Nenhum registro ainda.</p>');
    }).catch(function (e) { C.querySelector('.cartao').innerHTML = '<p class="vazio">❌ ' + esc(e) + '</p>'; });
    C.querySelector('[data-acao=imprimir]').onclick = function () { imprimir(); };
  }
  function telaAdmin() {
    C.innerHTML = titulo('Administrador', 'Acesso restrito. Toda tentativa de login fica no registro.') +
      '<div class="cartao" id="adm"><form id="fl"><div class="grade">' + campo(['senha', 'Senha do administrador', 'password']) + '</div><div class="acoes"><button class="bt">Entrar</button></div></form></div>';
    var senha = '';
    document.getElementById('fl').onsubmit = function (e) {
      e.preventDefault(); senha = document.getElementById('f_senha').value;
      srv('adminEntrar', senha, null).then(mostrar).catch(function (er) { aviso('❌ ' + esc(er)); });
    };
    function mostrar(r) {
      var c = r.config || CONFIG;
      document.getElementById('adm').innerHTML = '<h2 style="margin-top:0">Cabeçalho dos relatórios</h2><form id="fc"><div class="grade">' +
        campo(['unidade', 'Linha 1 (instituição)', 'larga']) + campo(['subunidade', 'Linha 2 (unidade / programa)', 'larga']) + campo(['cidade', 'Cidade']) +
        '</div><div class="acoes"><button class="bt">💾 Salvar configurações</button></div></form><div class="dica" style="margin-top:16px">O registro de edições não pode ser apagado pelo sistema. A planilha original fica no Drive do dono, protegida.</div>';
      ['unidade', 'subunidade', 'cidade'].forEach(function (k) { document.getElementById('f_' + k).value = c[k] || ''; });
      document.getElementById('fc').onsubmit = function (e) {
        e.preventDefault(); var n = { unidade: document.getElementById('f_unidade').value, subunidade: document.getElementById('f_subunidade').value, cidade: document.getElementById('f_cidade').value };
        srv('adminEntrar', senha, n).then(function (r2) { CONFIG = r2.config || n; aplicaConfig(); aviso('✅ Configurações salvas.'); }).catch(function (er) { aviso('❌ ' + esc(er)); });
      };
    }
    C.querySelector('[data-acao=imprimir]').onclick = function () { imprimir(); };
  }

  function telaInicio() {
    var a = [['vd', '💜 Violência doméstica', 'Atendimento e descumprimento de MPU'], ['sexual', '🛡️ Crime sexual', 'Acolhimento sem revitimização'], ['ligacao', '📞 Ligação Mulher Segura', 'Roteiro com 14 perguntas'],
      ['visita', '🏡 Visita', 'Relatório da visita presencial'], ['livro', '📒 Livro de registro', 'Ligações lançadas'], ['escala', '📅 Escala', 'Gerar e editar a escala'], ['efetivo', '👮 Efetivo', 'Policiais, RE, QRA e Cia'],
      ['rede', '🤝 Rede de apoio', 'Para orientar a vítima'], ['drive', '📁 Meus documentos', 'Tudo salvo no seu Drive']];
    C.innerHTML = '<h1>Olá' + (EMAIL ? ', ' + esc(EMAIL.split('@')[0]) : '') + ' 💜</h1><p class="desc">Escolha o que precisa fazer. Tudo pode ser impresso e salvo no seu Google Drive.</p>' +
      (DEMO ? '<div class="dica">Modo demonstração: aberto fora do Google Apps Script — nada é salvo no Drive.</div>' : '') +
      '<div class="atalhos">' + a.map(function (x) { return '<a href="#' + x[0] + '"><b>' + x[1] + '</b><span>' + x[2] + '</span></a>'; }).join('') + '</div>' +
      '<div class="cartao" style="margin-top:16px"><b>Em perigo agora?</b> Acione o <b>190</b>. Orientação 24 h: <b>180</b>.</div>';
  }

  /* ---------- navegação ---------- */
  var TELAS = { inicio: telaInicio, vd: function () { telaForm('vd'); }, sexual: function () { telaForm('sexual'); }, visita: function () { telaForm('visita'); }, ligacao: telaLigacao, livro: telaLivro, efetivo: telaEfetivo, escala: telaEscala, indicadores: telaIndicadores, pop: telaPop, rede: telaRede, drive: telaDrive, registro: telaRegistro, admin: telaAdmin };
  function navegar() {
    var pg = (location.hash || '#inicio').slice(1); if (!TELAS[pg]) pg = 'inicio';
    [].forEach.call(document.querySelectorAll('.menu a'), function (a) { a.classList.toggle('ativo', a.getAttribute('data-pg') === pg); });
    document.getElementById('menu').classList.remove('aberto');
    TELAS[pg](); C.focus(); window.scrollTo(0, 0);
  }
  function aplicaConfig() { document.getElementById('subUnidade').textContent = CONFIG.subunidade || ''; }
  // No Apps Script o hash não muda a URL do topo; tratamos o clique manualmente.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]'); if (!a) return;
    e.preventDefault(); try { history.replaceState(null, '', a.getAttribute('href')); } catch (x) { } navegar();
  });
  window.addEventListener('hashchange', navegar);
  document.getElementById('btMenu').onclick = function () { document.getElementById('menu').classList.toggle('aberto'); };

  navegar();
  srv('iniciar').then(function (r) { EMAIL = r.email || ''; CONFIG = r.config || CONFIG; document.getElementById('usuario').textContent = EMAIL; aplicaConfig(); if ((location.hash || '#inicio') === '#inicio') telaInicio(); })
    .catch(function (e) { aviso('❌ ' + esc(e)); });
})();
</script>
