<style>
/* Visual "Mulher Segura": barra lateral escura, cartões arredondados. A cor base vem do tema escolhido. */
:root{--lilas:#7a3fa0;--ok:#24734b;--perigo:#b63350;--atencao:#a86413}
html{
  --l950:color-mix(in srgb,var(--lilas) 42%,#0d0414);--l800:color-mix(in srgb,var(--lilas) 78%,#000);--l500:color-mix(in srgb,var(--lilas) 70%,#fff);
  --lilas-esc:var(--l800);--lilas-cl:color-mix(in srgb,var(--lilas) 11%,#fff);--lilas-md:color-mix(in srgb,var(--lilas) 32%,#fff);--l50:color-mix(in srgb,var(--lilas) 4%,#fff);
  --fundo:color-mix(in srgb,var(--lilas) 7%,#fdfbfe);--fundo2:color-mix(in srgb,var(--lilas) 14%,#fff);--cartao:#fff;--borda:color-mix(in srgb,var(--lilas) 13%,#f1edf3);
  --txt:#30263a;--sub:#776c80;--titulo:var(--l950);--alerta:#fdeef1;--editavel:#fffef6;--sombra:0 10px 30px color-mix(in srgb,var(--lilas) 9%,transparent)}
html[data-tema=lavanda]{--lilas:#8a7cc4}html[data-tema=ametista]{--lilas:#6b2f94}html[data-tema=rosa]{--lilas:#b0577f}
html[data-tema=malva]{--lilas:#8e5d7a}html[data-tema=azul]{--lilas:#2f4f8f}html[data-tema=ceu]{--lilas:#3d7ab8}
html[data-tema=salvia]{--lilas:#5b7f6a}html[data-tema=areia]{--lilas:#9a7b52}html[data-tema=grafite]{--lilas:#555b66}
html[data-modo=escuro]{--lilas-esc:color-mix(in srgb,var(--lilas) 45%,#fff);--lilas-cl:color-mix(in srgb,var(--lilas) 22%,#1d1a24);--lilas-md:color-mix(in srgb,var(--lilas) 45%,#1d1a24);--l50:color-mix(in srgb,var(--lilas) 10%,#1b1920);
  --fundo:color-mix(in srgb,var(--lilas) 14%,#111015);--fundo2:color-mix(in srgb,var(--lilas) 22%,#111015);--cartao:color-mix(in srgb,var(--lilas) 9%,#1c1a21);--borda:color-mix(in srgb,var(--lilas) 25%,#2c2a32);
  --txt:#eeebf2;--sub:#aaa4b3;--titulo:#fff;--alerta:#3a1f26;--editavel:#26222e;--sombra:0 10px 30px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:linear-gradient(145deg,var(--fundo),var(--fundo2));min-height:100vh;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}button{cursor:pointer}
/* estrutura */
.app-shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;background:linear-gradient(180deg,var(--l950),var(--l800));color:#fff;display:flex;flex-direction:column;gap:18px;box-shadow:12px 0 35px rgba(30,10,40,.16);z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.15)}
.brand-mark{width:54px;height:54px;flex:none;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,#d8b8e7,#fff);box-shadow:0 9px 20px rgba(0,0,0,.25)}
.brand-photo{width:100%;height:100%;object-fit:cover;display:block}
.brand-txt{min-width:0;flex:1}.brand strong{display:block;font-size:17px}.brand small{display:block;margin-top:3px;color:rgba(255,255,255,.75);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.nav-menu{display:grid;gap:4px}
.nav-menu .grupo{margin:12px 10px 2px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55)}
.nav-menu a{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 10px;border-radius:12px;color:rgba(255,255,255,.88);text-decoration:none;font-weight:700;font-size:13px;transition:.18s ease}
.nav-menu a span{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.11);font-size:14px}
.nav-menu a:hover,.nav-menu a.ativo{background:rgba(255,255,255,.15);color:#fff;transform:translateX(2px)}
.nav-menu a.ativo span{background:#fff}
.sidebar-footer{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.15)}
.sidebar-footer small{display:block;color:rgba(255,255,255,.7);margin-bottom:4px}.sidebar-footer strong{font-size:12px;overflow-wrap:anywhere}
.main-content{padding:30px 32px 60px;min-width:0}
.topbar{position:relative;display:flex;align-items:stretch;gap:18px;margin-bottom:22px}
.topbar-copy{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.eyebrow{font-size:10px;font-weight:900;color:var(--lilas-esc);letter-spacing:.12em;text-transform:uppercase}
.topbar h1{margin:5px 0;font-size:28px;line-height:1.15;letter-spacing:-.03em;color:var(--titulo)}
.topbar p{margin:0;color:var(--sub);font-size:13px}
.topbar-actions{margin-left:auto;display:flex;align-items:stretch;gap:12px}
.brand-hero-card{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;min-width:320px;max-width:420px;border:1px solid var(--borda);border-radius:18px;background:linear-gradient(135deg,var(--cartao),var(--l50));box-shadow:var(--sombra);position:relative;overflow:hidden}
.brand-hero-card::after{content:'';position:absolute;right:-38px;bottom:-38px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--lilas-cl) 0%,transparent 70%)}
.brand-hero-image{width:96px;height:110px;flex:none;object-fit:cover;object-position:center top;border-radius:16px;border:3px solid #fff;box-shadow:0 10px 20px rgba(60,30,80,.16);position:relative;z-index:1}
.brand-hero-copy{display:flex;flex-direction:column;gap:3px;position:relative;z-index:1;min-width:0}
.brand-hero-copy span{font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--lilas-esc)}
.brand-hero-copy strong{font-size:22px;line-height:1.1;color:var(--titulo)}
.brand-hero-copy small{font-size:11px;color:var(--sub);font-weight:700}
.bt-tema{width:48px;border:1px solid var(--borda);background:var(--cartao);border-radius:14px;font-size:18px;box-shadow:var(--sombra)}
.conteudo{outline:none}
/* conteúdo */
h1{font-size:22px;color:var(--titulo);margin:0 0 4px}
h2{font-size:17px;color:var(--titulo);margin:22px 0 10px}
.desc{color:var(--sub);margin:0 0 16px}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sombra)}
.cartao h2:first-child{margin-top:0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
label{display:block;margin:0 0 6px;font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.045em}
input,select,textarea{width:100%;min-height:42px;padding:10px 11px;border:1px solid var(--lilas-md);border-radius:10px;background:var(--cartao);color:var(--txt);outline:none;transition:.17s ease}
textarea{min-height:96px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--lilas);box-shadow:0 0 0 3px color-mix(in srgb,var(--lilas) 16%,transparent)}
input[readonly]{background:var(--l50);color:var(--sub)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--borda);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--txt);margin:0}
.check input{width:19px;min-height:19px;height:19px;margin-top:1px;accent-color:var(--lilas);flex:none}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.bt{min-height:42px;padding:0 18px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--lilas),var(--l800));color:#fff;font-weight:800;font-size:13px;box-shadow:0 7px 17px color-mix(in srgb,var(--lilas) 25%,transparent);transition:.17s ease}
.bt:hover{transform:translateY(-1px)}
.bt.sec{background:var(--lilas-cl);color:var(--lilas-esc);box-shadow:none}
.bt:disabled{opacity:.6;cursor:wait;transform:none}
.bt-icone{min-width:44px;min-height:44px;border:0;background:transparent;font-size:22px;color:inherit;border-radius:10px}
.imprimir{min-height:36px;padding:0 13px;border:1px solid var(--borda);border-radius:10px;background:var(--cartao);color:var(--lilas-esc);font-size:12px;font-weight:800}
.imprimir:hover{border-color:var(--lilas)}
.barra-pagina{display:flex;justify-content:flex-end;margin:-8px 0 10px}
.atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.atalhos a{display:block;padding:18px;min-height:104px;background:var(--cartao);border:1px solid var(--borda);border-radius:18px;color:var(--txt);text-decoration:none;box-shadow:var(--sombra);position:relative;overflow:hidden;transition:.17s ease}
.atalhos a::after{content:"";position:absolute;width:66px;height:66px;border-radius:50%;right:-22px;bottom:-26px;background:var(--lilas-cl)}
.atalhos a:hover{border-color:var(--lilas);transform:translateY(-2px)}
.atalhos b{display:block;color:var(--titulo);margin-bottom:4px;font-size:14px}.atalhos span{font-size:12px;color:var(--sub)}
.info-banner,.dica{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 17px;margin-bottom:14px;border:1px solid var(--lilas-md);border-radius:14px;background:var(--lilas-cl);font-size:13px}
.info-banner strong,.dica b{color:var(--lilas-esc)}
.alerta{padding:14px 17px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--perigo) 30%,transparent);border-left:5px solid var(--perigo);border-radius:14px;background:var(--alerta);font-size:13px}
.tabela{width:100%;border-collapse:collapse;font-size:12px;background:var(--cartao)}
.tabela th,.tabela td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--borda)}
.tabela th{background:var(--lilas-cl);color:var(--lilas-esc);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.tabela tr:hover td{background:var(--l50)}
.rolar{overflow-x:auto;border:1px solid var(--borda);border-radius:12px}
.tabela td[contenteditable]{background:var(--editavel);cursor:text}.tabela td[contenteditable]:focus{outline:2px solid var(--lilas)}
.passos{counter-reset:p;list-style:none;padding:0;margin:0}
.passos li{position:relative;padding:10px 0 10px 42px;border-bottom:1px solid var(--borda)}
.passos li::before{counter-increment:p;content:counter(p);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:8px;background:var(--lilas-cl);color:var(--lilas-esc);display:grid;place-items:center;font-size:12px;font-weight:900}
.pergunta{padding:12px 0;border-bottom:1px solid var(--borda)}.pergunta p{margin:0 0 8px;font-weight:600}
.opcoes{display:flex;gap:6px;flex-wrap:wrap}
.opcoes label{display:flex;align-items:center;gap:6px;margin:0;padding:6px 12px;border:1px solid var(--lilas-md);border-radius:999px;font-size:12px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--txt);cursor:pointer;min-height:36px}
.opcoes input{width:auto;min-height:0;accent-color:var(--lilas)}
.opcoes label:has(input:checked){background:var(--lilas-cl);border-color:var(--lilas);color:var(--lilas-esc)}
.aviso{position:fixed;right:24px;bottom:24px;z-index:80;max-width:min(440px,calc(100vw - 48px));padding:14px 16px;border-radius:12px;color:#fff;background:var(--l800);box-shadow:0 15px 40px rgba(0,0,0,.22);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s ease}
.aviso.ver{opacity:1;transform:none;pointer-events:auto}.aviso a{color:#fff}
.vazio{color:var(--sub);text-align:center;padding:22px}
.so-mobile{display:none}
.relatorio{display:none}
/* aparência */
.painel-tema{position:absolute;top:100%;right:0;margin-top:8px;width:290px;max-width:calc(100vw - 24px);background:var(--cartao);border:1px solid var(--borda);border-radius:16px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);z-index:60}
.painel-tema[hidden]{display:none}
.painel-tema p{margin:0 0 8px;font-size:10px;font-weight:900;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}
.modos{display:flex;gap:6px;margin-bottom:14px}.modos button{flex:1;min-height:40px;border:1px solid var(--borda);background:var(--cartao);color:var(--txt);border-radius:10px;font-size:12px;font-weight:700}
.modos button.sel{border-color:var(--lilas);background:var(--lilas-cl);color:var(--lilas-esc)}
.cores{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cores button{width:100%;aspect-ratio:1;min-height:40px;border-radius:50%;border:3px solid var(--cartao);outline:1px solid var(--borda)}
.cores button.sel{outline:2px solid var(--txt)}
.cores span{display:block;text-align:center;font-size:10px;color:var(--sub);margin-top:2px}
.fundo-menu{position:fixed;inset:0;background:rgba(20,8,28,.5);z-index:25}
.fundo-menu[hidden]{display:none}
/* celular */
@media (max-width:980px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-105%);transition:transform .2s}
  .sidebar.aberto{transform:none}
  .so-mobile{display:inline-grid;place-items:center}
  .main-content{padding:16px 16px 50px}
  .topbar{flex-wrap:wrap}
  .topbar #btMenu{align-self:flex-start;background:var(--cartao);border:1px solid var(--borda);color:var(--lilas-esc)}
  .topbar-actions{width:100%;margin-left:0}
  .brand-hero-card{min-width:0;flex:1}
}
@media (max-width:600px){
  .topbar h1{font-size:22px}
  .brand-hero-image{width:70px;height:80px}
  .brand-hero-copy strong{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* impressão: só o conteúdo */
@media print{
  @page{margin:14mm}
  html{--cartao:#fff!important;--txt:#222!important;--sub:#555!important;--borda:#ccc!important;--editavel:#fff!important;--titulo:#222!important;--lilas-esc:color-mix(in srgb,var(--lilas) 75%,#000)!important;--lilas-cl:color-mix(in srgb,var(--lilas) 11%,#fff)!important}
  body{background:#fff;font-size:11pt}
  .sidebar,.topbar,.aviso,.nao-imprimir,.acoes,.imprimir,.barra-pagina,.fundo-menu{display:none!important}
  .app-shell{display:block}.main-content{padding:0}
  body.modo-relatorio .tela{display:none!important}
  body.modo-relatorio .relatorio{display:block!important}
  .cartao{border:0;padding:0;box-shadow:none}
  .rolar{border:0}
  .tabela{font-size:9pt}.tabela th,.tabela td{border:1px solid #bbb}
}
.relatorio .cab{text-align:center;border-bottom:2px solid var(--lilas);padding-bottom:6px;margin-bottom:12px}
.relatorio h1{font-size:15pt;margin:0}.relatorio h2{font-size:12pt;border-bottom:1px solid var(--lilas-md)}
.relatorio table{border-collapse:collapse;width:100%}.relatorio td,.relatorio th{border:1px solid #bbb;padding:4px 6px;font-size:10pt;vertical-align:top}.relatorio th{background:#efe8fa;text-align:left;width:32%}
.relatorio .ass{margin-top:46px;text-align:center}
</style>
