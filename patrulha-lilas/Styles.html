<style>

  .kpi-label{font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.05em;min-height:27px}.kpi-value{font-size:29px;color:var(--lilac-950);font-weight:900;margin-top:8px}.kpi-detail{font-size:10px;color:var(--muted);margin-top:3px}

  /* Consulta: filtros por 1ª, 2ª e 3ª visita e quantidade realizada */
  .visit-filter-field{min-width:260px}
