  async function importMapBoundaryFile(event) {
    const input = event && event.target ? event.target : document.getElementById('mapBoundaryFile');
    const file = input && input.files && input.files[0];
    if (!file) return;

    setBusy(true, 'Lendo os limites do mapa CPC...');
    try {
      let kmlText = await readKmlOrKmzFile(file);
      const networkLink = extractNetworkLinkFromKml(kmlText);

      if (networkLink && !hasKmlBoundaryGeometry(kmlText)) {
        throw new Error(
          'O arquivo selecionado é somente um NetworkLink e não contém os polígonos. ' +
          'No Google My Maps, abra o menu do mapa, escolha “Exportar para KML/KMZ”, ' +
          'selecione a camada do 3º BPM/M e desmarque a opção de manter os dados atualizados por link de rede/NetworkLink. ' +
          'Depois importe o novo arquivo KML ou KMZ completo.'
        );
      }

      const boundaries = parseMapBoundariesFromKml(kmlText);
      const response = await server('salvarLimitesMapaImportados', {
        fileName: file.name,
        boundaries
      });
      state.mapBoundaryStatus = response.boundaryStatus || state.mapBoundaryStatus;
      renderMapBoundaryStatus(state.mapBoundaryStatus);
      hideMapWarning();
      showToast(response.message, 'success');
      await loadMapStatistics();
    } catch (error) {
      const message = error.message || String(error);
      showToast(message, 'error');
      showMapWarning(message);
    } finally {
      input.value = '';
      setBusy(false);
    }
  }

  async function readKmlOrKmzFile(file) {
    return readKmlOrKmzBuffer(await file.arrayBuffer(), file.name || 'mapa.kml');
  }

  async function readKmlOrKmzBuffer(buffer, fileName) {
    const bytes = new Uint8Array(buffer);
    const isZip = /\.kmz$/i.test(String(fileName || '')) || (bytes.length > 1 && bytes[0] === 80 && bytes[1] === 75);
    if (!isZip) return new TextDecoder('utf-8').decode(bytes);

    if (typeof JSZip === 'undefined') {
      throw new Error('Não foi possível abrir o KMZ porque a biblioteca de compactação não carregou. Atualize a página e tente novamente.');
    }
    const zip = await JSZip.loadAsync(buffer);
    const entries = Object.values(zip.files).filter(entry => !entry.dir && /\.kml$/i.test(entry.name));
    if (!entries.length) throw new Error('O arquivo KMZ não contém um arquivo KML válido.');
    const preferred = entries.find(entry => /(^|\/)doc\.kml$/i.test(entry.name)) || entries[0];
    return preferred.async('string');
  }

  function parseKmlDocument(kmlText) {
    const xml = new DOMParser().parseFromString(String(kmlText || ''), 'application/xml');
    const parserError = xml.getElementsByTagName('parsererror')[0];
    if (parserError) throw new Error('O arquivo selecionado não é um KML válido.');
    return xml;
  }

  function extractNetworkLinkFromKml(kmlText) {
    let xml;
    try { xml = parseKmlDocument(kmlText); } catch (error) { return ''; }
    const elements = Array.from(xml.getElementsByTagName('*'));
    const networkLink = elements.find(element => String(element.localName || element.nodeName || '').split(':').pop() === 'NetworkLink');
    if (!networkLink) return '';
    const href = Array.from(networkLink.getElementsByTagName('*')).find(element => String(element.localName || element.nodeName || '').split(':').pop() === 'href');
    return href ? String(href.textContent || '').trim() : '';
  }

  function hasKmlBoundaryGeometry(kmlText) {
    let xml;
    try { xml = parseKmlDocument(kmlText); } catch (error) { return false; }
    return Array.from(xml.getElementsByTagName('*')).some(element => {
      const name = String(element.localName || element.nodeName || '').split(':').pop();
      return name === 'Polygon' || name === 'LineString';
    });
  }

  function normalizeFullKmlUrl(value) {
    let url;
    try { url = new URL(String(value || '').trim()); } catch (error) {
      throw new Error('O NetworkLink do arquivo não possui um endereço válido.');
    }
    const host = url.hostname.toLowerCase();
    if (!(host === 'google.com' || host === 'www.google.com' || host.endsWith('.google.com')) || !/\/maps\/d\//i.test(url.pathname)) {
      throw new Error('Por segurança, somente o NetworkLink do Google My Maps pode ser utilizado.');
    }
    const expectedMapId = state.bootstrap?.mapConfig?.sourceMapId || '';
    const receivedMapId = url.searchParams.get('mid') || '';
    if (expectedMapId && receivedMapId && receivedMapId !== expectedMapId) {
      throw new Error('O arquivo pertence a outro mapa. Utilize o mapa CPC indicado na Página 6.');
    }
    if (expectedMapId && !receivedMapId) url.searchParams.set('mid', expectedMapId);
    url.searchParams.set('forcekml', '1');
    return url.toString();
  }

  async function fetchNetworkLinkedKml(fullKmlUrl) {
    const response = await fetch(fullKmlUrl, {
      method: 'GET',
      mode: 'cors',
      credentials: 'omit',
      cache: 'no-store',
      redirect: 'follow'
    });
    if (!response.ok) throw new Error('O mapa completo retornou HTTP ' + response.status + '.');
    const contentType = String(response.headers.get('content-type') || '').toLowerCase();
    const fileName = contentType.includes('zip') || contentType.includes('kmz') ? 'mapa-completo.kmz' : 'mapa-completo.kml';
    const text = await readKmlOrKmzBuffer(await response.arrayBuffer(), fileName);
    if (!/<kml(?:\s|>)/i.test(String(text || ''))) {
      throw new Error('O endereço não devolveu um KML/KMZ completo.');
    }
    return text;
  }

  function configureFullMapDownload(fullKmlUrl) {
    return fullKmlUrl;
  }

  function triggerFullMapDownload(fullKmlUrl) {
    configureFullMapDownload(fullKmlUrl);
    const anchor = document.createElement('a');
    anchor.href = fullKmlUrl;
    anchor.target = '_blank';
    anchor.rel = 'noopener noreferrer';
    anchor.style.display = 'none';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
  }

  function parseMapBoundariesFromKml(kmlText) {
    const xml = new DOMParser().parseFromString(String(kmlText || ''), 'application/xml');
    const parserError = xml.getElementsByTagName('parsererror')[0];
    if (parserError) throw new Error('O arquivo selecionado não é um KML válido.');

    const boundaries = [];
    const foundCompanies = new Set();

    function localName(element) {
      return String(element.localName || element.nodeName || '').split(':').pop();
    }
    function directChildText(element, name) {
      const child = Array.from(element.children || []).find(item => localName(item) === name);
      return child ? String(child.textContent || '').trim() : '';
    }
    function descendants(element, name) {
      return Array.from(element.getElementsByTagName('*')).filter(item => localName(item) === name);
    }
    function walk(element, inheritedCia, path) {
      const ownName = directChildText(element, 'name');
      const currentCia = matchMapCiaClient(ownName) || inheritedCia;
      const nextPath = ownName ? path.concat([ownName]) : path;

      if (localName(element) === 'Placemark') {
        const cia = matchMapCiaClient(ownName) || currentCia;
        if (!cia) return;
        const sourceName = ownName || nextPath.join(' / ') || cia;

        descendants(element, 'Polygon').forEach(polygon => {
          const coordinateElement = descendants(polygon, 'coordinates')[0];
          if (!coordinateElement) return;
          const coordinates = simplifyBoundaryCoordinates(parseKmlCoordinatesClient(coordinateElement.textContent), 7000);
          if (coordinates.length >= 3) {
            boundaries.push({ cia, type: 'POLYGON', coordinates, sourceName });
            foundCompanies.add(cia);
          }
        });
        descendants(element, 'LineString').forEach(line => {
          const coordinateElement = descendants(line, 'coordinates')[0];
          if (!coordinateElement) return;
          const coordinates = simplifyBoundaryCoordinates(parseKmlCoordinatesClient(coordinateElement.textContent), 7000);
          if (coordinates.length >= 2) {
            boundaries.push({ cia, type: 'LINE', coordinates, sourceName });
            foundCompanies.add(cia);
          }
        });
        return;
      }

      Array.from(element.children || []).forEach(child => walk(child, currentCia, nextPath));
    }

    walk(xml.documentElement, '', []);
    const required = ['1ª CIA', '2ª CIA', '3ª CIA'];
    const missing = required.filter(cia => !foundCompanies.has(cia));
    if (missing.length) {
      throw new Error('O arquivo foi aberto, mas não foram encontrados os limites de: ' + missing.join(', ') + '. Use o KML/KMZ exportado do mapa CPC indicado na Página 6.');
    }
    if (!boundaries.length) throw new Error('Nenhum polígono ou linha das três Cias foi encontrado no arquivo.');
    return boundaries;
  }

  function matchMapCiaClient(value) {
    const key = String(value || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (/12(?:O)?BPMM1(?:A)?CIA/.test(key) || /12BPMM1CIA/.test(key)) return '1ª CIA';
    if (/12(?:O)?BPMM2(?:A)?CIA/.test(key) || /12BPMM2CIA/.test(key)) return '2ª CIA';
    if (/12(?:O)?BPMM3(?:A)?CIA/.test(key) || /12BPMM3CIA/.test(key)) return '3ª CIA';
    return '';
  }

  function parseKmlCoordinatesClient(text) {
    return String(text || '').trim().split(/\s+/).map(token => {
      const parts = token.split(',');
      const lng = Number(parts[0]);
      const lat = Number(parts[1]);
      return Number.isFinite(lat) && Number.isFinite(lng) ? [lat, lng] : null;
    }).filter(Boolean);
  }

  function simplifyBoundaryCoordinates(coordinates, maxPoints) {
    if (!Array.isArray(coordinates) || coordinates.length <= maxPoints) return coordinates || [];
    const step = Math.ceil(coordinates.length / maxPoints);
    const simplified = coordinates.filter((point, index) => index === 0 || index === coordinates.length - 1 || index % step === 0);
    const first = coordinates[0];
    const last = coordinates[coordinates.length - 1];
    if (first && last && (first[0] === last[0] && first[1] === last[1])) {
      const end = simplified[simplified.length - 1];
      if (!end || end[0] !== first[0] || end[1] !== first[1]) simplified.push(first);
    }
    return simplified;
  }

  function renderMapStatistics(data) {
    const summary = data.summary || {};
    const selectedCia = data.filters?.cia || '1ª, 2ª e 3ª Cia';
    document.getElementById('mapResultTitle').textContent = `Ocorrências – ${selectedCia}`;
    document.getElementById('mapResultSubtitle').textContent = `Período de ${formatDate(data.filters?.dateFrom)} a ${formatDate(data.filters?.dateTo)}.`;
    document.getElementById('mapUpdated').textContent = 'Atualizado em ' + (data.generatedAt || '—');
    document.getElementById('mapSummary').innerHTML = [
      ['Ocorrências no período', summary.occurrences || 0, 'Registros após os filtros'],
      ['Ocorrências no mapa', summary.plottedOccurrences || 0, 'Com coordenadas localizadas'],
      ['Locais diferentes', summary.uniqueLocations || 0, 'Pontos agrupados por localização'],
      ['Maior concentração', summary.maxAtSameLocation || 0, 'Ocorrências no mesmo ponto'],
      ['Sem localização', summary.unlocated || 0, 'Endereços ainda não localizados']
    ].map(card => `<div class="card map-summary-card"><span>${escapeHtml(card[0])}</span><strong>${card[1]}</strong><small>${escapeHtml(card[2])}</small></div>`).join('');

    const warnings = [];
    if (data.boundaryWarning) warnings.push(data.boundaryWarning);
    if (summary.pendingGeocoding) warnings.push(`${summary.pendingGeocoding} ocorrência(s) possuem endereço, mas ainda não aparecem no mapa. Use “Processar endereços pendentes”.`);
    if (summary.missingAddress) warnings.push(`${summary.missingAddress} ocorrência(s) não possuem endereço cadastrado e precisam ser corrigidas na base para aparecer no mapa.`);
    if (!data.points?.length && summary.occurrences) warnings.push('Existem ocorrências no período, mas nenhuma possui coordenadas disponíveis ainda.');
    if (warnings.length) showMapWarning(warnings.join(' ')); else hideMapWarning();

    const geocodeButton = document.getElementById('mapGeocodeButton');
    geocodeButton.disabled = !summary.pendingGeocoding;
    geocodeButton.textContent = summary.pendingGeocoding
      ? `Processar endereços pendentes (${summary.pendingGeocoding})`
      : 'Endereços processados';

    renderStatisticalMaps(data);
  }

  function ensureLeafletMaps(center) {
    if (typeof L === 'undefined') throw new Error('A biblioteca do mapa não foi carregada. Verifique a conexão com a internet e atualize a página.');
    const initial = [Number(center?.lat) || -23.606995, Number(center?.lng) || -46.653155];
    const zoom = Number(center?.zoom) || 14;
    ['heat', 'points'].forEach(key => {
      if (state.maps[key]) return;
      const elementId = key === 'heat' ? 'heatMap' : 'pointsMap';
      const map = L.map(elementId, { zoomControl: true, preferCanvas: true }).setView(initial, zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      state.maps[key] = map;
      state.mapLayers[key] = L.layerGroup().addTo(map);
    });
  }

  function renderStatisticalMaps(data) {
    ensureLeafletMaps(data.center);
    state.mapLayers.heat.clearLayers();
    state.mapLayers.points.clearLayers();

    addMapBoundaries(state.maps.heat, state.mapLayers.heat, data.boundaries || []);
    addMapBoundaries(state.maps.points, state.mapLayers.points, data.boundaries || []);

    const points = data.points || [];
    const maxCount = Math.max(1, Number(data.summary?.maxAtSameLocation) || 1);
    if (points.length && typeof L.heatLayer === 'function') {
      const heatData = points.map(point => [Number(point.lat), Number(point.lng), Math.max(0.25, Number(point.count) / maxCount)]);
      L.heatLayer(heatData, {
        radius: 32,
        blur: 24,
        minOpacity: 0.35,
        maxZoom: 18,
        gradient: { 0.15: '#fff9a8', 0.45: '#ffd54f', 0.7: '#ff9800', 0.88: '#f44336', 1: '#b71c1c' }
      }).addTo(state.mapLayers.heat);
    }

    points.forEach(point => {
      const count = Number(point.count) || 1;
      const level = count === 1 ? 'green' : (count === 2 ? 'orange' : 'red');
      const label = count >= 100 ? '99+' : String(count);
      const icon = L.divIcon({
        className: 'stat-point-div-icon',
        html: `<div class="stat-point-marker ${level}">${escapeHtml(label)}</div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22],
        popupAnchor: [0, -22]
      });
      const marker = L.marker([Number(point.lat), Number(point.lng)], { icon });
      const natureHtml = (point.natures || []).map(item => `<li>${escapeHtml(item.label)}: <strong>${Number(item.value) || 0}</strong></li>`).join('');
      marker.bindPopup(`<div class="stat-popup"><strong>${count} ocorrência${count === 1 ? '' : 's'} no local</strong><span>${escapeHtml(point.address || 'Endereço não informado')}</span><span><b>CIA:</b> ${escapeHtml(point.cia || '—')}</span><span><b>Período no ponto:</b> ${formatDate(point.firstDate)} a ${formatDate(point.lastDate)}</span>${natureHtml ? `<ul>${natureHtml}</ul>` : ''}</div>`, { maxWidth: 330 });
      marker.addTo(state.mapLayers.points);
    });

    const bounds = collectMapBounds(data.boundaries || [], points);
    ['heat', 'points'].forEach(key => {
      if (bounds && bounds.isValid()) state.maps[key].fitBounds(bounds, { padding: [24, 24], maxZoom: 16 });
      else state.maps[key].setView([data.center.lat, data.center.lng], data.center.zoom || 14);
    });
    window.setTimeout(() => {
      state.maps.heat.invalidateSize();
      state.maps.points.invalidateSize();
    }, 80);
  }

  function addMapBoundaries(map, layerGroup, boundaries) {
    const styles = {
      '1ª CIA': { color: '#6a1b9a', fillColor: '#ce93d8' },
      '2ª CIA': { color: '#8e24aa', fillColor: '#e1bee7' },
      '3ª CIA': { color: '#512da8', fillColor: '#b39ddb' }
    };
    boundaries.forEach(boundary => {
      const coordinates = (boundary.coordinates || []).map(point => [Number(point[0]), Number(point[1])]).filter(point => Number.isFinite(point[0]) && Number.isFinite(point[1]));
      if (coordinates.length < 2) return;
      const style = styles[boundary.cia] || styles['1ª CIA'];
      const layer = boundary.type === 'LINE'
        ? L.polyline(coordinates, { color: style.color, weight: 4, opacity: 0.9, dashArray: '8 6' })
        : L.polygon(coordinates, { color: style.color, weight: 3, opacity: 0.95, fillColor: style.fillColor, fillOpacity: 0.08 });
      layer.bindTooltip(boundary.cia, { sticky: true, direction: 'top', className: 'cia-boundary-tooltip' });
      layer.addTo(layerGroup);
    });
  }

  function collectMapBounds(boundaries, points) {
    if (typeof L === 'undefined') return null;
    const latLngs = [];
    boundaries.forEach(boundary => (boundary.coordinates || []).forEach(point => {
      const lat = Number(point[0]);
      const lng = Number(point[1]);
      if (Number.isFinite(lat) && Number.isFinite(lng)) latLngs.push([lat, lng]);
    }));
    points.forEach(point => {
      const lat = Number(point.lat);
      const lng = Number(point.lng);
      if (Number.isFinite(lat) && Number.isFinite(lng)) latLngs.push([lat, lng]);
    });
    return latLngs.length ? L.latLngBounds(latLngs) : null;
  }

  function switchMapTab(tab) {
    state.activeMapTab = tab === 'points' ? 'points' : 'heat';
    document.querySelectorAll('[data-map-tab]').forEach(button => button.classList.toggle('active', button.dataset.mapTab === state.activeMapTab));
    document.querySelectorAll('.map-panel').forEach(panel => panel.classList.toggle('active', panel.id === 'map-panel-' + state.activeMapTab));
    window.setTimeout(() => state.maps[state.activeMapTab]?.invalidateSize(), 80);
  }

  function showMapWarning(message) {
    const box = document.getElementById('mapWarning');
    box.textContent = message;
    box.classList.remove('hidden');
  }

  function hideMapWarning() {
    const box = document.getElementById('mapWarning');
    box.textContent = '';
    box.classList.add('hidden');
  }

  async function loadConsulta() {
    setSectionLoading('queryTable');
    try {
      const visitCounts = [1, 2, 3]
        .filter(number => document.getElementById(`queryVisit${number}`).checked)
        .map(String);
      state.query = await server('getConsulta', {
        year: Number(document.getElementById('queryYear').value),
        month: Number(document.getElementById('queryMonth').value),
        search: document.getElementById('querySearch').value,
        visitCounts: visitCounts,
        onlyFiles: document.getElementById('queryOnlyFiles').checked
      });
      document.getElementById('queryCount').textContent = `${state.query.length} ocorrência${state.query.length === 1 ? '' : 's'}`;
      renderConsulta();
    } catch (error) {
      showToast(error.message, 'error');
      document.getElementById('queryTable').innerHTML = emptyHtml('Não foi possível consultar os registros.');
    }
  }

  function renderConsulta() {
    const container = document.getElementById('queryTable');
    if (!state.query.length) {
      container.innerHTML = emptyHtml('Nenhuma ocorrência encontrada para os filtros selecionados.');
      return;
    }
    container.innerHTML = `<table><thead><tr><th>Data</th><th>Vítima</th><th>Autor</th><th>BOPM / BOPC</th><th>Natureza</th><th>CIA</th><th>Nº de visitas realizadas</th><th>Status</th><th>Arquivos</th><th>Ação</th></tr></thead><tbody>${state.query.map((record, index) => {
      const visitCount = Math.max(0, Math.min(3, Number(record.visitasRealizadas) || 0));
      const visitLabel = visitCount === 1 ? '1 visita realizada' : `${visitCount} visitas realizadas`;
      const visitSteps = [1, 2, 3].map(number =>
        `<span class="visit-step${visitCount >= number ? ' done' : ''}">${number}ª ${visitCount >= number ? 'REALIZADA' : 'PENDENTE'}</span>`
      ).join('');
      return `<tr><td>${formatDate(record.dataOcorrencia)}<br><small>${escapeHtml(record.qtr || '')}</small></td><td><strong>${escapeHtml(record.nomeVitima)}</strong><br><small>${escapeHtml(record.id)}</small></td><td>${escapeHtml(record.nomeAutor || '—')}</td><td>${escapeHtml(record.bopm || '—')}<br>${escapeHtml(record.bopc || '—')}</td><td>${escapeHtml(record.natureza || '—')}</td><td>${escapeHtml(record.cia || '—')}</td><td><div class="visit-count-cell"><span class="visit-count-badge${record.limiteVisitasAtingido ? ' maxed' : ''}">${visitCount}</span><div><strong>${visitLabel}</strong><small>de 3 permitidas</small><div class="visit-steps">${visitSteps}</div>${record.limiteVisitasAtingido ? '<span class="visit-limit-text">Limite atingido</span>' : ''}</div></div></td><td><span class="status-pill">${escapeHtml(record.statusCaso || '—')}</span></td><td>${record.hasFiles ? `<div class="linked-files-cell"><span class="file-indicator">${record.links.length} arquivo(s) vinculado(s)</span><div class="linked-file-list">${record.links.map((link, linkIndex) => `<a class="linked-file-link" href="${escapeAttr(link)}" target="_blank" rel="noopener noreferrer" title="${escapeAttr(link)}">Abrir arquivo ${linkIndex + 1}</a>`).join('')}</div></div>` : '<span class="no-file">Sem arquivos</span>'}</td><td><div class="table-actions"><button class="button summary small" data-summary-index="${index}" type="button">Ver resumo</button><button class="button secondary small" data-file-index="${index}" type="button">Vincular arquivos</button><button class="button danger small" data-delete-index="${index}" type="button">Excluir</button></div></td></tr>`;
    }).join('')}</tbody></table>`;
    container.querySelectorAll('[data-summary-index]').forEach(button => button.addEventListener('click', () => openOccurrenceSummaryModal(Number(button.dataset.summaryIndex))));
    container.querySelectorAll('[data-file-index]').forEach(button => button.addEventListener('click', () => openFilesModal(Number(button.dataset.fileIndex))));
    container.querySelectorAll('[data-delete-index]').forEach(button => button.addEventListener('click', () => confirmDeleteOccurrence(Number(button.dataset.deleteIndex))));
  }

  async function openOccurrenceSummaryModal(index) {
    const record = state.query[index];
    if (!record) return;
    document.getElementById('occurrenceSummaryTitle').textContent = `${record.nomeVitima || 'Ocorrência'} — ${formatDate(record.dataOcorrencia)}`;
    document.getElementById('occurrenceSummaryContent').innerHTML = '<div class="empty-state"><div class="spinner" style="margin:0 auto 10px"></div>Carregando resumo...</div>';
    openModal('occurrenceSummaryModal');
    try {
      const data = await server('getOccurrenceSummary', record.id);
      renderOccurrenceSummary(data);
    } catch (error) {
      document.getElementById('occurrenceSummaryContent').innerHTML = emptyHtml('Não foi possível carregar o resumo da ocorrência.');
      showToast(error.message, 'error');
    }
  }

  function renderOccurrenceSummary(data) {
    const visits = Array.isArray(data.visits) ? data.visits : [];
    const visitHtml = visits.length ? visits.map(visit => `
      <article class="summary-visit-card">
        <div class="summary-visit-heading"><strong>${escapeHtml(formatVisitSequence(visit.sequencia))}</strong><span class="status-pill">${escapeHtml(visit.statusVisita || '—')}</span></div>
        <div class="summary-mini-grid">
          ${summaryItem('Tipo', visit.tipoVisita || 'Não informado')}
          ${summaryItem('Agendada', `${visit.dataAgendada || '—'}${visit.horaAgendada ? ' às ' + visit.horaAgendada : ''}`)}
          ${summaryItem('Realização', visit.dataRealizacao ? `${visit.dataRealizacao}${visit.horaRealizacao ? ' às ' + visit.horaRealizacao : ''}` : 'Ainda não realizada')}
          ${summaryItem('Resultado', visit.resultadoVisita || '—')}
          ${summaryItem('FONAR', visit.fonarPreenchido ? `${visit.fonarPreenchido}${visit.fonarArquivoNome ? ' — ' + visit.fonarArquivoNome : ''}` : 'Não informado')}
          ${summaryItem('Nº do BO-e complementar', visit.numeroBoeComplementar || 'Não informado')}
        </div>
        ${visit.fonarArquivoUrl ? `<a class="summary-file-link" href="${escapeAttr(visit.fonarArquivoUrl)}" target="_blank" rel="noopener noreferrer">Abrir FONAR anexado</a>` : ''}
        ${visit.observacoesVisita ? `<div class="summary-observation"><span>Observações da visita</span><p>${escapeHtml(visit.observacoesVisita)}</p></div>` : ''}
      </article>`).join('') : '<div class="empty-state">Nenhuma visita registrada para esta ocorrência.</div>';

    document.getElementById('occurrenceSummaryContent').innerHTML = `
      <div class="summary-status-line"><span class="status-pill">${escapeHtml(data.statusCaso || '—')}</span><strong>${escapeHtml(data.natureza || 'Natureza não informada')}</strong></div>
      <div class="detail-grid summary-main-grid">
        ${detailHtml('Data / QTR', `${data.dataOcorrencia || '—'} ${data.qtr || ''}`)}
        ${detailHtml('BOPM / BOPC', [data.bopm, data.bopc].filter(Boolean).join(' / ') || 'Não informado')}
        ${detailHtml('Vítima', data.nomeVitima)}
        ${detailHtml('Autor', data.nomeAutor)}
        ${detailHtml('Telefone', data.telefone)}
        ${detailHtml('CIA', data.cia)}
        ${detailHtml('Endereço', data.endereco, true)}
        ${detailHtml('Contato telefônico', data.resultadoLigacao || 'Ainda não concluído')}
        ${detailHtml('Aceitou contato / deseja visita', `${data.aceitouLigacao || '—'} / ${data.desejaVisita || '—'}`)}
        ${detailHtml('Resumo do ocorrido', data.breveHistorico || 'Não informado', true)}
      </div>
      <div class="summary-section-title"><span class="eyebrow">HISTÓRICO DO ACOMPANHAMENTO</span><h3>Visitas registradas</h3></div>
      <div class="summary-visits-list">${visitHtml}</div>`;
  }

  function summaryItem(label, value) {
    return `<div class="summary-mini-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || '—')}</strong></div>`;
  }

  async function confirmDeleteOccurrence(index) {
    const record = state.query[index];
    if (!record) return;
    const victimName = record.nomeVitima || 'esta ocorrência';
    const firstConfirmation = askConfirmation(`Deseja realmente excluir a ocorrência de ${victimName}? Esta ação removerá também os acompanhamentos vinculados.`);
    if (!firstConfirmation) return;
    const finalConfirmation = askConfirmation(`Confirma a exclusão definitiva da ocorrência de ${victimName}? Esta ação não poderá ser desfeita.`);
    if (!finalConfirmation) return;
    setBusy(true, 'Excluindo ocorrência...');
    try {
      const response = await server('excluirOcorrencia', { id: record.id });
      showToast(response.message, 'success');
      await loadConsulta();
    } catch (error) {
      showToast(error.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  function openFilesModal(index) {
    const record = state.query[index];
    document.getElementById('filesRecordId').value = record.id;
    document.getElementById('filesModalTitle').textContent = record.nomeVitima + ' – ' + formatDate(record.dataOcorrencia);
    document.getElementById('filesLinks').value = record.linksArquivos || '';
    document.getElementById('filesNotes').value = record.observacoesArquivos || '';
    renderExistingLinks(record.links || []);
    openModal('filesModal');
  }

  function renderExistingLinks(links) {
    const container = document.getElementById('existingLinks');
    container.innerHTML = links.length ? `<span class="eyebrow">LINKS ATUAIS</span>${links.map((link, index) => `<a href="${escapeAttr(link)}" target="_blank" rel="noopener noreferrer">Abrir arquivo ${index + 1}: ${escapeHtml(link)}</a>`).join('')}` : '';
  }

  async function submitFilesForm(event) {
    event.preventDefault();
    const payload = { id: document.getElementById('filesRecordId').value, linksArquivos: document.getElementById('filesLinks').value, observacoesArquivos: document.getElementById('filesNotes').value };
    setBusy(true, 'Vinculando arquivos...');
    try {
      const response = await server('salvarArquivos', payload);
      showToast(response.message, 'success');
      closeModal('filesModal');
      await loadConsulta();
    } catch (error) {
      showToast(error.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  function detailHtml(label, value, wide) {
    return `<div class="detail-item${wide ? ' wide' : ''}"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || 'Não informado')}</strong></div>`;
  }

  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function setSectionLoading(id) { document.getElementById(id).innerHTML = '<div class="empty-state"><div class="spinner" style="margin:0 auto 10px"></div>Carregando...</div>'; }
  function emptyHtml(message) { return `<div class="empty-state">${escapeHtml(message)}</div>`; }

  function setBusy(active, message) {
    const overlay = document.getElementById('loadingOverlay');
    if (message) overlay.querySelector('strong').textContent = message;
    overlay.classList.toggle('hidden', !active);
  }
  function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

  function showToast(message, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.className = 'toast', 4300);
  }

  function serverForm(functionName, formElement) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error?.message || String(error))))[functionName](formElement);
    });
  }

  // todas as chamadas passam pelo App, que confirma a conta e repassa ao Registro
  function server(functionName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error?.message || String(error))))
        .api(functionName, JSON.parse(JSON.stringify(args)));
    });
  }

  function formatTime(value) {
    const text = String(value || '').trim();
    if (!text) return 'HORÁRIO NÃO INFORMADO';
    const match = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(text);
    if (match) return `${String(Number(match[1])).padStart(2, '0')}:${match[2]}`;
    return 'HORÁRIO INVÁLIDO';
  }

  function formatTimeForInput(value) {
    const formatted = formatTime(value);
    return /^\d{2}:\d{2}$/.test(formatted) ? formatted : '';
  }

  function formatDate(value) {
    if (!value) return '—';
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    return match ? `${match[3]}/${match[2]}/${match[1]}` : value;
  }
  function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#039;', '"':'&quot;' }[char])); }
  function escapeAttr(value) { return escapeHtml(value); }
})();
</script>
